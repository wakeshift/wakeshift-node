name: Release

# Pushing a tag v<version> (the version in package.json) publishes that
# version of @wakeshift/sdk to npm through trusted publishing: npm trusts this
# workflow's OIDC token, so no npm token or one-time password is stored here,
# and npm records provenance (which commit and workflow built it) with the
# package. The tarball tested is the one published. Then a GitHub release
# for the tag carries the tarball, its CycloneDX SBOM and the CHANGELOG's
# notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Type-check and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # No install scripts: a compromised dependency runs nothing here.
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run typecheck
      - run: WAKESHIFT_EXAMPLES_README_ONLY=1 npm test

  pack:
    name: Pack
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: The tag matches the package's version, and the CHANGELOG has it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG doesn't match the version in package.json ($version)" >&2
            exit 1
          fi
          if ! grep -q "^## $version (" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $version (## $version (<date>))" >&2
            exit 1
          fi
          # The entry's notes, for the GitHub release.
          mkdir -p dist
          awk -v v="$version" '
            $0 ~ "^## " { if (on) exit; if (index($0, "## " v " (") == 1) { on = 1; next } }
            on { print }
          ' CHANGELOG.md >dist/notes.md
      - run: npm ci --ignore-scripts --no-fund --no-audit
      # npm pack runs prepack (the build), explicitly here.
      - run: npm pack --pack-destination dist
      - name: SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev >"dist/wakeshift-sdk-$(node -p 'require("./package.json").version').cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npmjs.com's trusted publisher for @wakeshift/sdk names this workflow
    # (release.yml) and this environment.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@wakeshift/sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm supports trusted publishing
        run: |
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install -g --ignore-scripts --no-fund --no-audit npm@11.12.1
          fi
          npm --version
      - name: Publish the tested tarball, with provenance
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # ./ first: npm reads "dist/x.tgz" as the GitHub repository dist/x.tgz.
          tgz=./$(ls dist/*.tgz)
          # A prerelease (0.7.0-rc.1) doesn't become latest.
          case "$TAG" in
          *-*) dist_tag=next ;;
          *) dist_tag=latest ;;
          esac
          npm publish "$tgz" --provenance --access public --tag "$dist_tag"

  release:
    name: GitHub release, with the SBOM
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
            --title "$TAG" --notes-file dist/notes.md dist/*.tgz dist/*.cdx.json
